baseURL: /
title: Tekton
minify:
  minifyOutput: true
enableRobotsTXT: true
theme:
  - github.com/imfing/hextra
enableGitInfo: true
contentDir: content/en
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableMissingTranslationPlaceholders: true
disableKinds:
  - taxonomy
enableEmoji: true
ignoreFiles:
  - vendor/.*
rss_sections:
  - blog
permalinks:
  blog: /:section/:year/:month/:day/:slug/
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart
services:
  googleAnalytics:
    id: G-G2WH79BEEM
languages:
  en:
    title: Tekton
    languageName: English
    weight: 1
    params:
      description: Kubernetes Native CI/CD

params:
  description: Kubernetes Native CI/CD
  images:
    - /images/tekton-og-share.png
  github_repo: https://github.com/tektoncd/website
  github_repo_for_badges: tektoncd/pipeline

  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 140
      height: 36

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  editURL:
    enable: true
    base: https://github.com/tektoncd/website/edit/main/content

  footer:
    displayPoweredBy: false

  theme:
    default: system
    displayToggle: false

  page:
    width: wide

  links:
    developer:
      - name: Slack
        url: https://join.slack.com/t/tektoncd/shared_invite/zt-1z8ctzsyv-wLXWwA2Rl3AOhcNGqpWRUw
        icon: fab fa-slack
        desc: Slack Channel for Tekton Project
      - name: GitHub
        url: https://github.com/tektoncd
        icon: fab fa-github
        desc: GitHub organization for the Tekton project

menu:
  main:
    - identifier: Documentation
      name: Documentation
      pageRef: /docs
      weight: 1
    - identifier: Components
      name: Components
      pageRef: /components
      weight: 2
    - identifier: Solutions
      name: Solutions
      pageRef: /solutions
      weight: 3
    - identifier: CaseStudies
      name: Case Studies
      pageRef: /case-studies
      weight: 4
    - identifier: Blog
      name: Blog
      pageRef: /blog
      weight: 5
    - identifier: Community
      name: Community
      pageRef: /community
      weight: 6
    - identifier: search
      weight: 7
      params:
        type: search
    - identifier: GitHub
      name: GitHub
      url: https://github.com/tektoncd/pipeline
      weight: 8
      params:
        icon: github
    - identifier: Slack
      name: Slack
      url: https://join.slack.com/t/tektoncd/shared_invite/zt-1z8ctzsyv-wLXWwA2Rl3AOhcNGqpWRUw
      weight: 9
      params:
        icon: slack
    - identifier: theme-toggle
      weight: 10
      params:
        type: theme-toggle
