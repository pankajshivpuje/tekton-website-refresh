{{ define "main" }}
<div class="error-page">
  <div class="error-code">404</div>
  <h1 class="error-heading">Page not found</h1>
  <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
  <a href="/" class="hextra-hero-btn-primary error-btn">Go Home</a>
</div>

<style>
.error-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  text-align: center;
  padding: 2rem 1rem;
}
.error-code {
  font-size: 6rem;
  font-weight: 800;
  line-height: 1;
  color: #d1d5db;
  margin-bottom: 0.5rem;
}
:root.dark .error-code {
  color: #374151;
}
.error-heading {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 0.75rem;
}
.error-message {
  font-size: 1rem;
  color: #6b7280;
  margin: 0 0 2rem;
  max-width: 400px;
}
:root.dark .error-message {
  color: #9ca3af;
}
.error-btn {
  text-decoration: none;
}
</style>
{{ end }}
